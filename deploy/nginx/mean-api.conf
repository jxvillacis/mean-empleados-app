# Nginx como proxy inverso de la API (PM2, puerto 3000, cerrado al exterior). setup-ec2.sh reemplaza __DOMINIO__
# por el nombre de la IP elástica (<ip-con-guiones>.sslip.io) y Certbot agrega el bloque HTTPS (443) y la
# redirección desde el 80.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name __DOMINIO__;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
