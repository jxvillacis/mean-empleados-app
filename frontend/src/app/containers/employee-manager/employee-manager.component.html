<!-- Orquestador: lee los flujos con el async pipe y conecta los componentes presentacionales -->
<div class="container">
  <div class="header">
    <h4>Gestión de Empleados</h4>
    <div *ngIf="currentUser$ | async as user" class="session">
      <span class="grey-text text-darken-2">{{ user.email }} ({{ user.rol }})</span>
      <button type="button" class="btn-flat" (click)="onLogout()">Cerrar sesión</button>
    </div>
  </div>

  <app-error-alert
    [message]="error$ | async"
    (dismiss)="onDismissError()">
  </app-error-alert>

  <div class="row">
    <div class="col s12 m4">
      <app-employee-form
        [employee]="selected$ | async"
        [resetSignal]="(formReset$ | async) ?? 0"
        (save)="onSave($event)"
        (cancel)="onCancel()">
      </app-employee-form>
    </div>

    <div class="col s12 m8">
      <app-employee-list
        [employees]="(employees$ | async) ?? []"
        [loading]="(loading$ | async) ?? false"
        (edit)="onEdit($event)"
        (remove)="onRemove($event)">
      </app-employee-list>
    </div>
  </div>
</div>
